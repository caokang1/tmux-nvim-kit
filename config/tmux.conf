# ---- 基础 ----
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 20000
set -g default-terminal "tmux-256color"
# 先恢复默认再追加：重新加载配置（前缀 r）时不会越叠越多
set -su terminal-features
set -sa terminal-features "xterm-256color:RGB"
set -g window-size latest
set -g aggressive-resize on
set -g set-clipboard on            # 让 Neovim 的 OSC 52 复制穿透 tmux
set -g base-index 1                # 窗口从 1 开始编号，前缀+1 就是第一个
setw -g pane-base-index 1
set -g renumber-windows on

# 窗口名自动显示为当前目录名（即项目名）
setw -g automatic-rename on
# 在 Windows 盘（/mnt/c、/mnt/d…）上的窗口名后标 [Windows盘]，和 WSL 里的同名项目区分开
setw -g automatic-rename-format '#{b:pane_current_path}#{?#{m:/mnt/*,#{pane_current_path}}, [Windows盘],}'

# 分屏/新窗口沿用当前目录
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "配置已重新加载"

# 前缀 ?：弹出中文速查表（快捷键 + 常用命令），q / Esc 关闭；tmux 原来的英文全部按键列表改到 前缀 Alt+?
bind ? display-popup -E -w 80 -h 38 -T " 帮助 " -b rounded -S "fg=#7aa2f7" ~/.local/bin/tmux-help
bind M-? list-keys -N

# ---- 外观（与 Neovim tokyonight-night 配色一致）----
set -g status-position bottom
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold] #S #[bg=#16161e] "
set -g status-right "#[fg=#565f89]%m-%d %H:%M "
# 窗口处于放大状态（前缀 z）时在窗口名后标出，避免误以为分屏失败
setw -g window-status-format "#[fg=#565f89] #I #W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-format "#[bg=#292e42,fg=#7aa2f7,bold] #I #W#{?window_zoomed_flag,#[fg=#e0af68] [已放大 前缀z还原],} "
setw -g window-status-separator ""

# 分屏边框：标题栏显示面板编号和项目目录
setw -g pane-border-status top
setw -g pane-border-format " #P #{b:pane_current_path}#{?#{m:/mnt/*,#{pane_current_path}}, [Windows盘],} "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines heavy

set -g message-style "bg=#292e42,fg=#7aa2f7"
set -g mode-style "bg=#2e3c64"
setw -g clock-mode-colour "#7aa2f7"

# 扩展按键：把 Shift+Enter、Ctrl+Enter 等组合键原样传给程序（Claude Code 用 Shift+Enter 换行）
set -s extended-keys on
set -s extended-keys-format csi-u
set -sa terminal-features 'xterm*:extkeys'

# 链接：把程序输出的可点击链接（OSC 8）传给终端，折行的长链接也能整段点击
# Windows Terminal 里按住 Ctrl+Shift 单击打开（Shift 绕过 tmux 鼠标，单独 Ctrl+单击留给 Neovim 跳转）
set -sa terminal-features 'xterm*:hyperlinks'
# 前缀 u：列出当前面板里的链接，选中后在 Windows 浏览器中打开（不用鼠标，折行的链接也能用）
bind u run-shell -b '~/.local/bin/tmux-open-url "#{pane_id}" "#{client_name}"'

# 复制：鼠标拖选后保持选中（不自动复制），按 Ctrl+C 复制到系统剪贴板，和 Windows 习惯一致
# 没有进入选择状态时 Ctrl+C 仍是中断命令
bind -T copy-mode MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode C-c send -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send -X copy-selection-and-cancel
# 复制模式下单击面板即退出复制模式，回到正常输入（避免点一下误入复制模式后无法打字）
bind -T copy-mode MouseDown1Pane select-pane \; send -X cancel
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X cancel

# Ctrl/Alt+左键点击时选中面板并把点击转发给程序（Neovim 里用来跳转到定义）
bind -n C-MouseDown1Pane select-pane -t = \; send -M
bind -n M-MouseDown1Pane select-pane -t = \; send -M

# Shift+滚轮（以及触控板左右滑动，浏览器页面会转成 Shift+滚轮）交给程序，Neovim 里用来横向滚动
bind -n S-WheelUpPane if -F "#{mouse_any_flag}" { send -M }
bind -n S-WheelDownPane if -F "#{mouse_any_flag}" { send -M }

# 右键不弹 tmux 自己的菜单（在浏览器里会和浏览器右键菜单叠在一起），右键留给浏览器/终端
unbind -q -n MouseDown3Pane
unbind -q -n M-MouseDown3Pane
unbind -q -n MouseDown3Status
unbind -q -n MouseDown3StatusLeft
unbind -q -n MouseDown3StatusRight
unbind -q -n M-MouseDown3Status
unbind -q -n M-MouseDown3StatusLeft
